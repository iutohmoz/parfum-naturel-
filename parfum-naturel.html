  .app { max-width: 620px; margin: 0 auto; }
  .lang-bar { display: flex; gap: 8px; margin-bottom: 2rem; flex-wrap: wrap; }
  .lang-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid #ddd; background: transparent; color: #666; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .lang-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .hero-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #1a1a1a; }
  .hero-sub { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 2rem; }
  .progress { display: flex; gap: 6px; margin-bottom: 1.5rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; transition: background 0.2s; }
  .dot.done { background: #888; }
  .dot.cur { background: #1a1a1a; }
  .step-label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.75rem; }
  .question { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 1.25rem; line-height: 1.4; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .opt { padding: 12px 16px; border-radius: 10px; border: 1.5px solid #e5e5e5; background: #fff; color: #1a1a1a; font-size: 14px; cursor: pointer; text-align: center; line-height: 1.4; transition: all 0.15s; }
  .opt:hover { border-color: #aaa; background: #f5f5f5; }
  .opt.sel { border-color: #1a1a1a; background: #f0f0f0; font-weight: 600; }
  .nav { display: flex; gap: 10px; margin-top: 1rem; }
  .btn { padding: 11px 22px; border-radius: 10px; border: 1.5px solid #1a1a1a; background: transparent; color: #1a1a1a; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: #f0f0f0; }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .btn-main { background: #1a1a1a; color: #fff; }
  .btn-main:hover { background: #333; }
  .result-card { background: #fff; border: 1.5px solid #e5e5e5; border-radius: 14px; padding: 1.75rem; margin-bottom: 1rem; }
  .r-name { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
  .r-tag { font-size: 14px; color: #888; margin-bottom: 1.5rem; font-style: italic; }
  .ing-header { display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #aaa; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; margin-bottom: 4px; }
  .ing-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f5f5f5; }
  .ing-row:last-child { border-bottom: none; }
  .ing-left { display: flex; align-items: center; gap: 8px; }
  .ing-name { font-size: 14px; color: #1a1a1a; }
  .note-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f0f0f0; color: #666; }
  .ing-right { display: flex; align-items: center; gap: 10px; }
  .bar-wrap { width: 50px; height: 4px; background: #eee; border-radius: 2px; }
  .bar-fill { height: 4px; border-radius: 2px; background: #1a1a1a; }
  .ing-pct { font-size: 13px; color: #888; min-width: 30px; text-align: right; font-weight: 600; }
  .tip-box { background: #f8f7f4; border-radius: 10px; padding: 14px 18px; font-size: 14px; color: #555; line-height: 1.7; margin-bottom: 1.25rem; border-left: 3px solid #ddd; }
  .tip-box strong { color: #1a1a1a; }
  .restart { font-size: 13px; color: #888; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 4px 0; }
  .badge { display: inline-block; background: #f0faf5; color: #2d7a56; font-size: 12px; padding: 3px 10px; border-radius: 10px; margin-bottom: 1rem; font-weight: 600; }
  @media (max-width: 480px) {
    .opts { grid-template-columns: 1fr 1fr; }
    .hero-title { font-size: 20px; }

let lang='fr', step=0, ans=[];

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach((b,i)=>b.classList.toggle('active',['fr','en','ru','es'][i]===l));
  document.getElementById('hero-title').textContent=DB[l].title;
  document.getElementById('hero-sub').textContent=DB[l].sub;
  if(!ans.length) render();
}

function renderProg(){
  const total=DB[lang].qs.length;
  document.getElementById('prog').innerHTML=Array.from({length:total},(_,i)=>
    `<div class="dot ${i<step?'done':i===step?'cur':''}"></div>`).join('');
}

function render(){
  const t=DB[lang]; renderProg();
  if(step>=t.qs.length){renderResult();return;}
  const q=t.qs[step]; const sel=ans[step];
  const isLast=step===t.qs.length-1;
  document.getElementById('area').innerHTML=`
    <div class="step-label">${step+1} / ${t.qs.length}</div>
    <div class="question">${q.q}</div>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt${sel===i?' sel':''}" onclick="pick(${i})">${o}</button>`).join('')}</div>
    <div class="nav">
      ${step>0?`<button class="btn" onclick="back()">← </button>`:''}
      <button class="btn btn-main" id="nb" onclick="fwd()" ${sel===undefined?'disabled':''}>
        ${isLast?t.gen:t.next} →
      </button>
    </div>`;
}

function pick(i){
  ans[step]=i;
  document.querySelectorAll('.opt').forEach((b,idx)=>b.classList.toggle('sel',idx===i));
  const nb=document.getElementById('nb'); if(nb) nb.disabled=false;
}
function fwd(){if(ans[step]===undefined)return;step++;render();}
function back(){step--;render();}
function score(f){return(f.mood===ans[0]?3:0)+(f.time===ans[1]?2:0)+(f.intensity===ans[2]?2:0)+(f.note===ans[3]?2:0)+(f.skin===ans[4]?1:0);}

function renderResult(){
  const t=DB[lang];
  const best=FORMULAS.reduce((a,b)=>score(b)>score(a)?b:a);
  const nl=t.noteLabels;
  renderProg();
  document.getElementById('area').innerHTML=`
    <div class="badge">${t.bioLabel}</div>
    <div class="result-card">
      <div class="r-name">${best.name[lang]}</div>
      <div class="r-tag">${best.tagline[lang]}</div>
      <div class="ing-header"><span>${t.ingLabel}</span><span>${t.noteLabel} / ${t.pctLabel}</span></div>
      ${best.ingredients.map(ing=>`
        <div class="ing-row">
          <div class="ing-left">
            <span class="ing-name">${ing[lang]}</span>
            <span class="note-tag">${nl[ing.note]}</span>
          </div>
          <div class="ing-right">
            <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(ing.pct*0.5)}px"></div></div>
            <span class="ing-pct">${ing.pct}%</span>
          </div>
        </div>`).join('')}
    </div>
    <div class="tip-box"><strong>${t.tipLabel} :</strong> ${best.tip[lang]}</div>
    <button class="restart" onclick="restart()">↩ ${t.restart}</button>`;
}

function restart(){step=0;ans=[];render();}

document.getElementById('hero-title').textContent=DB[lang].title;
document.getElementById('hero-sub').textContent=DB[lang].sub;
render();
</script>
</body>
</html>
